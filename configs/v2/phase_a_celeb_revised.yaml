seed: 42
device: cuda
data:
  active_datasets: [CelebDFv3]
  dataset_roots:
    DFD: E:/PhD/Deepfake Video TCN+BCNN/Datasets/DFD-Kaggle
    CelebDFv3: E:/PhD/Deepfake Video TCN+BCNN/Datasets/CelebDFv3/CelebDFv3
  frame_mode: face
  face_crop: true
  face_margin: 0.50
  crop_padding: replicate
  face_box_cache: artifacts/face_cache
  align_landmarks: true
  clip_length: 32
  require_full_clip: true
  train_clip_strides: [1]
  eval_clip_stride: 1
  # Same 8 clips per video as full validation, so the threshold calibrated on
  # the selection set applies to identically computed video scores.
  selection_clips_per_video: 8
  selection_max_fakes_per_dataset: 1000
  selection_seed: 42
  # Additional 1:2 development report from the full scored set. Its fake
  # videos exclude the 1,000 fakes used for checkpoint selection.
  fixed_ratio_validation_fake_per_real: 2
  fixed_ratio_validation_seed: 43
  eval_clips_per_video: 8
  eval_clip_chunk_size: 4
  # No augmentation in the revised protocol: clips are never flipped.
  horizontal_flip_probability: 0.0
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  train_balance_keys: [dataset, class_name]
  num_workers: 2
  persistent_workers: true
model:
  architecture: 3d_cnn
  input_resize: 256
  center_crop: 256
  activation: relu
  norm: batch
  conv_channels: [16, 24, 32]
  temporal_kernel_size: 3
  conv1_spatial_stride: 1
  stage_pool_type: avg
  final_pool_type: avg
  spatial_output_size: 4
  temporal_head: tcn
  temporal_aggregation: gap
  temporal_steps: 32
  feature_dim: 512
  deterministic_hidden_dim: 0
  dropout: 0.2
train:
  run_dir: artifacts/v2_revised/celeb_e4_gap_seed42
  epochs: 60
  physical_batch_size: 8
  # One pass over the 622 real + 1,244 fake pool per epoch (234 batches),
  # random class mix with at least one real and one fake clip per batch.
  epoch_protocol: pool_pass
  gradient_accumulation_steps: 1
  precision: amp
  learning_rate: 0.0001
  lr_gamma: 0.95
  gradient_clip_norm: 5.0
  calibration_fpr: 0.05
