seed: 42
device: cuda
data:
  active_datasets: [DFD]
  dataset_roots:
    DFD: E:/PhD/Deepfake Video TCN+BCNN/Datasets/DFD-Kaggle
    CelebDFv3: E:/PhD/Deepfake Video TCN+BCNN/Datasets/CelebDFv3/CelebDFv3
  frame_mode: decimate
  # The memory lever for the physical batch of 8 below. Step 2 gives 960x540,
  # step 3 gives 640x360 at 44% of the pixels and 44% of the activations, and
  # neither changes a layer -- unlike conv1 stride 2, which would make DFD a
  # different architecture from CelebDF++. Set it from vram_probe.py on the
  # actual card rather than from an extrapolation, then keep the chosen step
  # fixed for the whole DFD chain: E2, E3, E4 and the order control are only
  # comparable with each other at one input scale.
  decimate_step: 2
  face_crop: false
  clip_length: 32
  train_clip_strides: [1, 2]
  eval_clip_stride: 2
  selection_clips_per_video: 4
  selection_max_fakes_per_dataset: 1000
  selection_seed: 42
  eval_clips_per_video: 8
  eval_clip_chunk_size: 4
  horizontal_flip_probability: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  train_balance_keys: [dataset, class_name]
  num_workers: 2
  persistent_workers: true
model:
  architecture: 3d_cnn
  input_resize: 256
  center_crop: 256
  activation: relu
  norm: batch
  conv_channels: [16, 24, 32]
  temporal_kernel_size: 3
  conv1_spatial_stride: 1
  stage_pool_type: avg
  final_pool_type: avg
  spatial_output_size: 4
  temporal_head: tcn
  temporal_aggregation: gap
  temporal_steps: 32
  feature_dim: 512
  deterministic_hidden_dim: 0
  dropout: 0.2
train:
  run_dir: artifacts/v2/dfd_e4_gap_seed42
  epochs: 60
  clips_per_class_per_epoch: 1000
  # Eight, matching CelebDF++, and not four with accumulation two. Accumulation
  # reproduces the optimizer's effective batch but leaves batch normalisation
  # looking at the physical batch, and BN composition is the largest single
  # effect measured on this ladder (E1 to E2, +0.119 AUROC). A DFD run whose BN
  # sees 2 real + 2 fake would not be comparable with CelebDF++ at 4 + 4, and
  # the cross-dataset question is the whole reason for running DFD.
  physical_batch_size: 8
  gradient_accumulation_steps: 1
  precision: amp
  learning_rate: 0.0001
  lr_gamma: 0.95
  gradient_clip_norm: 5.0
  calibration_fpr: 0.05
