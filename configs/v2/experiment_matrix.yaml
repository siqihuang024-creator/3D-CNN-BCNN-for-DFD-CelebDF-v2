# Overrides relative to phase_a_<dataset>.yaml. Run each selected E4-prime
# aggregation with seeds 42, 43 and 44; E0-E4 may use seed 42 for screening.
E0:
  data: {clip_length: 8}
  model: {temporal_steps: 8, spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap}
  train: {physical_batch_size: 1, gradient_accumulation_steps: 1}
E1:
  model: {spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap}
  train: {physical_batch_size: 1, gradient_accumulation_steps: 1}
E2_celeb:
  model: {spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap}
  train: {physical_batch_size: 8, gradient_accumulation_steps: 1}
E2_dfd:
  # Same batch as E2_celeb on purpose. This entry used to force 4 with
  # accumulation 2, which would have overridden phase_a_dfd.yaml and left DFD's
  # BatchNorm looking at 2 real + 2 fake against CelebDF++'s 4 + 4 -- the one
  # variable the ladder already showed to be worth +0.119 AUROC. If it does not
  # fit, raise data.decimate_step (fewer pixels), not this.
  model: {spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap}
  train: {physical_batch_size: 8, gradient_accumulation_steps: 1}
E2_interleave:
  # E2 with conv2 and conv3 sliding along the channel-interleaved depth axis:
  # each position's channels are laid out in order, c1..cC of position 1 then
  # of position 2, and the kernel -- the same 3 positions x C channels x 5x5 as
  # E2, so the same 105,769 parameters -- steps this many planes. E2 is [16, 24]
  # (one whole position); [1, 4] lets windows start part-way through one.
  # Depth grows 32 -> 497 -> 2977 and is averaged away by the mean head as
  # before. Two samples at a time go through each interleaved conv+pool and are
  # recomputed in backward; BatchNorm still sees the full 4 real + 4 fake.
  # CelebDFv3 only: DFD's E2 already fills a 12 GB card.
  model: {spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap,
          interleave_strides: [1, 4], interleave_chunk_size: 2}
  train: {physical_batch_size: 8, gradient_accumulation_steps: 1}
E2_interleave_budget:
  # Same channel-interleaved kernels and E2 batch protocol as E2_interleave,
  # with a coarser scan for a practical first run. Depth: 32 -> 249 -> 745.
  # It still changes compute, temporal sampling density, and BN statistics;
  # equal parameter count alone does not isolate a learned channel relation.
  model: {spatial_output_size: 22, feature_dim: 15488,
          temporal_head: mean, temporal_aggregation: gap,
          interleave_strides: [2, 8], interleave_chunk_size: 2}
  train: {physical_batch_size: 8, gradient_accumulation_steps: 1}
E3:
  model: {spatial_output_size: 4, feature_dim: 512,
          temporal_head: mean, temporal_aggregation: gap}
E4_gap: {model: {temporal_head: tcn, temporal_aggregation: gap}}
E4_max: {model: {temporal_head: tcn, temporal_aggregation: max}}
E4_attention: {model: {temporal_head: tcn, temporal_aggregation: attention}}
E4_cls: {model: {temporal_head: tcn, temporal_aggregation: cls}}
E4_flatten: {model: {temporal_head: tcn, temporal_aggregation: flatten}}
E4_flatten64: {model: {temporal_head: tcn, temporal_aggregation: flatten64}}
E7_mc3:
  model: {architecture: mc3_18, pretrained: true, temporal_head: tcn,
          temporal_aggregation: gap,
          feature_dim: 512}
  data:
    normalize_mean: [0.43216, 0.394666, 0.37645]
    normalize_std: [0.22803, 0.22145, 0.216989]
  train: {physical_batch_size: 4, gradient_accumulation_steps: 2}
E7b_mc3_frozen:
  model: {architecture: mc3_18, pretrained: true, temporal_head: none,
          temporal_aggregation: gap,
          feature_dim: 512}
  data:
    normalize_mean: [0.43216, 0.394666, 0.37645]
    normalize_std: [0.22803, 0.22145, 0.216989]
