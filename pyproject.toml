[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-video-bcnn-v2"
version = "0.1.0"
description = "3D-CNN representation learning and Bayesian anomaly detection for deepfake video"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "numpy>=1.21,<2.0",
  "opencv-python-headless>=4.5,<5",
  "Pillow>=8.4",
  "PyYAML>=6.0",
  "scikit-learn>=1.0",
  "scipy>=1.7,<2.0",
  "tqdm>=4.64",
  "pyro-ppl>=1.8.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
